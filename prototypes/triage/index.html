<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundwork · Triage queue prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f5;
  --panel: #ffffff;
  --ink: #18181b;
  --ink-2: #52525b;
  --ink-3: #a1a1aa;
  --line: #e7e5e4;
  --line-2: #f1f0ee;
  --accent: #4f46e5;
  --accent-soft: #eef2ff;
  --up: #c2410c;
  --up-soft: #fff1e6;
  --down: #0f766e;
  --down-soft: #e6f6f4;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, system-ui, sans-serif; font-size: 13px; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

/* chrome */
.top { display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 48px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand-mark { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #4f46e5, #0f766e); }
.ws { color: var(--ink-3); font-weight: 500; }
.nav { display: flex; gap: 4px; }
.nav a { padding: 6px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.nav a.on { background: var(--line-2); color: var(--ink); }
.nav .count { margin-left: 6px; font-size: 11px; background: var(--warn-soft); color: var(--warn); padding: 1px 6px; border-radius: 10px; }
.nav .count.zero { display: none; }
.top .spacer { flex: 1; }
.run-meta { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.tb { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; padding: 12px 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tb h1 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.tb .spacer { flex: 1; }
.tb .keys { color: var(--ink-3); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
main { min-height: 0; overflow: auto; position: relative; }
.variant { display: none; }
.variant.on { display: block; }

/* switcher */
.switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; background: #18181b; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 50; max-width: calc(100vw - 16px); }
.switcher button { border: 0; background: none; color: #a1a1aa; padding: 7px 14px; border-radius: 8px; font-weight: 600; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.switcher button kbd { font-family: var(--mono); font-size: 10px; border: 1px solid #3f3f46; border-bottom-width: 1px; border-radius: 4px; padding: 0 4px; color: #71717a; background: none; }
.switcher button.on { background: #fafafa; color: #18181b; }
.switcher button.on kbd { border-color: #d4d4d8; color: #71717a; }
.switcher .short { display: none; }
.switcher .sep { width: 1px; background: #3f3f46; margin: 4px 2px; }

/* shared bits */
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.flat { background: var(--line-2); color: var(--ink-2); }
.pill.linked { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 7px 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary kbd { background: none; border-color: #52525b; color: #a1a1aa; }
.btn.danger { color: var(--up); }
.btn.sm { padding: 3px 8px; font-size: 12px; gap: 6px; }
.btn .lbl { overflow: hidden; text-overflow: ellipsis; }
kbd { font-family: var(--mono); font-size: 10.5px; font-weight: 500; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); color: var(--ink-2); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; }
.section-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 20px 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.section-h kbd { text-transform: none; letter-spacing: 0; }
.quote-meta { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quote-meta b { color: var(--ink-2); font-weight: 600; }
.redact { font-family: var(--mono); font-size: .86em; background: var(--line-2); color: var(--ink-2); border-radius: 3px; padding: 0 3px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line-2); }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.b2 i { background: #a5b4fc; }
.bar.none i { background: var(--ink-3); }

/* beam rows (shared) */
.beam { display: grid; gap: 4px; }
.br { display: grid; grid-template-columns: 22px minmax(0, 1fr) 140px 42px; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: left; width: 100%; }
.br .rk { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.br .nm { font-weight: 600; min-width: 0; }
.br .nm small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 500; margin-top: 1px; }
.br .pct { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; }
.br.none { border-style: dashed; color: var(--ink-2); }
.br.none .nm { font-weight: 500; }

/* picker */
.scrim { position: fixed; inset: 0; background: rgba(24,24,27,.18); z-index: 60; display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.scrim.on { display: flex; }
.picker { width: 520px; max-width: 100%; background: var(--panel); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column; max-height: 70vh; }
.picker-h { padding: 12px 14px 0; font-size: 12px; color: var(--ink-3); }
.picker-h b { color: var(--ink); font-weight: 600; }
.picker input { border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; font: inherit; font-size: 14px; outline: none; width: 100%; }
.plist { overflow: auto; padding: 6px; min-height: 0; }
.pgroup { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 10px 8px 4px; }
.popt { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 7px; }
.popt .nm { flex: 1; min-width: 0; }
.popt .nm small { display: block; color: var(--ink-3); font-size: 11.5px; }
.popt.hi { background: var(--accent-soft); }
.popt .pct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.picker-f { display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 11.5px; flex-wrap: wrap; }
.pempty { padding: 16px 8px; color: var(--ink-3); }

/* toast */
.toast { position: fixed; top: 58px; left: 50%; transform: translate(-50%, -8px); background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: 500; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 55; max-width: calc(100vw - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast kbd { background: none; border-color: #52525b; color: #d4d4d8; margin-left: 6px; }

/* empty state */
.empty { max-width: 560px; margin: 56px auto 0; padding: 0 20px 110px; text-align: center; }
.empty .tick { width: 44px; height: 44px; border-radius: 50%; background: var(--down-soft); color: var(--down); display: grid; place-items: center; font-size: 20px; margin: 0 auto 14px; }
.empty h2 { font-size: 19px; margin: 0 0 6px; letter-spacing: -0.01em; }
.empty p { color: var(--ink-2); line-height: 1.55; margin: 0 0 6px; }
.empty .tally { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 18px 0; text-align: left; }
.empty .tally > div { padding: 10px 12px; border-right: 1px solid var(--line); }
.empty .tally > div:last-child { border-right: 0; }
.empty .tally .k { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-bottom: 3px; }
.empty .tally .v { font-size: 17px; font-weight: 650; }
.empty .labels { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; margin-bottom: 18px; }
.empty .lab { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 12px; }
.empty .lab:last-child { border-bottom: 0; }
.empty .lab span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.empty .row { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }

/* ---------- A: Focus ---------- */
.focus { max-width: 760px; margin: 0 auto; padding: 24px 24px 110px; }
.prog { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--ink-2); }
.prog .bar { flex: 1; height: 4px; }
.prog .bar i { background: var(--ink); }
.prog b { color: var(--ink); }
.fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: 0 4px 18px rgba(0,0,0,.03); }
.fcard .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.fcard blockquote { margin: 0 0 10px; font-size: 18px; line-height: 1.5; letter-spacing: -0.005em; border-left: 3px solid #fcd34d; padding-left: 14px; }
.factions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-top: 18px; }
.factions .btn { padding: 10px 14px; justify-content: center; }
.factions .btn.primary { justify-content: space-between; }
.next { margin-top: 18px; }
.next .ni { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line-2); color: var(--ink-2); }
.next .ni span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- B: List ---------- */
.list { padding: 16px 28px 110px; }
.colhead, .lrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 300px 262px; gap: 16px; }
.colhead { padding: 0 16px 8px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.lrow { align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; padding: 12px 16px; cursor: pointer; }
.lrow.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 4px 18px rgba(79,70,229,.10); }
.lrow .q { min-width: 0; }
.lrow .q p { margin: 0 0 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lrow.sel .q p { -webkit-line-clamp: unset; }
.mini { display: grid; gap: 6px; }
.mini .m { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 2px 8px; align-items: center; }
.mini .m span:first-child { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .m .pct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); text-align: right; }
.mini .m .bar { grid-column: 1 / -1; height: 5px; }
.lacts { display: flex; gap: 6px; justify-content: flex-end; }
.lrow:not(.sel) .lacts { opacity: 0; }
.lrow:not(.sel):hover .lacts { opacity: 1; }
.lrow:not(.sel) .lacts kbd { display: none; }

/* ---------- C: Inbox ---------- */
#v-inbox.on { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: 100%; }
.ilist { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding-bottom: 90px; }
.ilist-h { position: sticky; top: 0; background: var(--panel); padding: 12px 16px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); border-bottom: 1px solid var(--line-2); z-index: 1; }
.ii { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line-2); background: none; padding: 10px 16px 11px 13px; border-left: 3px solid transparent; }
.ii:hover { background: #fafaf9; }
.ii.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.ii .t { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; font-weight: 600; min-width: 0; }
.ii .t span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ii p { margin: 0 0 4px; color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.idetail { overflow: auto; padding: 22px 28px 110px; min-width: 0; }
.idetail .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.idetail blockquote { margin: 0 0 8px; font-size: 15px; line-height: 1.55; border-left: 3px solid #fcd34d; padding-left: 12px; max-width: 680px; }
.ibeam { display: grid; gap: 6px; max-width: 680px; }
.ibeam .br { grid-template-columns: 22px minmax(0, 1fr) 120px 42px 116px; cursor: pointer; }
.ibeam .go { justify-self: end; }
.ibeam .br:hover { border-color: var(--ink-3); }
.ibeam .br:first-child { border-color: #c7d2fe; background: #fbfbff; }
.ipick { max-width: 680px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.ipick input { border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; font: inherit; outline: none; width: 100%; }
.ipick:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ipick .plist { max-height: 232px; }

/* narrow screens */
@media (max-width: 760px) {
  .app { display: block; height: auto; }
  main { overflow: visible; }
  .top { gap: 12px; padding: 0 14px; }
  .ws, .run-meta, .nav a.wide { display: none; }
  .tb { padding: 10px 14px; }
  .tb .keys { display: none; }
  .switcher button { padding: 7px 10px; gap: 6px; }
  .switcher .long { display: none; }
  .switcher .short { display: inline; }
  .focus { padding: 14px 12px 110px; }
  .fcard { padding: 16px 14px; }
  .fcard blockquote { font-size: 16px; }
  .factions { grid-template-columns: 1fr 1fr; }
  .factions .btn.primary { grid-column: 1 / -1; }
  .br { grid-template-columns: 18px minmax(0, 1fr) 42px; }
  .br .bar { grid-column: 2 / -1; grid-row: 2; }
  .list { padding: 12px 12px 110px; }
  .colhead { display: none; }
  .lrow { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px; }
  .lrow:not(.sel) .lacts { display: none; }
  .lacts { justify-content: stretch; }
  .lacts .btn { flex: 1; justify-content: center; padding: 8px 10px; font-size: 13px; }
  #v-inbox.on { display: flex; flex-direction: column; height: auto; }
  .idetail { order: -1; padding: 16px 12px 20px; border-bottom: 1px solid var(--line); overflow: visible; }
  .ilist { border-right: 0; overflow: visible; padding-bottom: 110px; }
  .ibeam .br { grid-template-columns: 18px minmax(0, 1fr) 42px; }
  .ibeam .br .bar { grid-column: 2 / 4; grid-row: 2; }
  .ibeam .br .go { grid-column: 2 / -1; grid-row: 3; justify-self: start; }
  .scrim { padding: 56px 8px 8px; }
  .picker { max-height: calc(100vh - 140px); }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brand-mark"></div>Groundwork <span class="ws">/ Acme Analytics</span></div>
    <nav class="nav">
      <a href="#">Opportunities</a>
      <a class="on" href="#">Triage<span class="count" id="badge"></span></a>
      <a class="wide" href="#">Sources</a>
      <a class="wide" href="#">Accounts</a>
      <a class="wide" href="#">Packs</a>
    </nav>
    <div class="spacer"></div>
    <div class="run-meta">pack place v3 · jev-1.13.0 · place threshold 0.70</div>
  </header>
  <div class="tb" id="tb"></div>
  <main>
    <section class="variant" id="v-focus"></section>
    <section class="variant" id="v-list"></section>
    <section class="variant" id="v-inbox"></section>
  </main>
</div>

<div class="scrim" id="scrim"><div class="picker" role="dialog" aria-label="Move to opportunity" id="picker"></div></div>
<div class="toast" id="toast"></div>
<div class="switcher" id="switcher"></div>

<script>
const OUTCOMES = {
  o1: 'Get customer data in without engineering help',
  o2: 'Trust the numbers in reports',
  o3: 'Share findings with stakeholders',
  o4: 'Control access and spend',
};

const OPPORTUNITIES = [
  { id: 'p1', name: 'CSV imports fail silently on malformed rows', outcome: 'o1' },
  { id: 'p2', name: 'Field mapping must be redone for every import', outcome: 'o1' },
  { id: 'p3', name: 'No way to backfill historical data', outcome: 'o1' },
  { id: 'p4', name: "Dashboard totals don't match the source system", outcome: 'o2' },
  { id: 'p5', name: "Can't tell when data was last refreshed", outcome: 'o2' },
  { id: 'p6', name: 'Timezone handling shifts daily counts', outcome: 'o2' },
  { id: 'p7', name: 'Exported charts lose formatting in slides', outcome: 'o3' },
  { id: 'p8', name: 'Viewers need a paid seat to see a dashboard', outcome: 'o3' },
  { id: 'p9', name: 'No scheduled email digest', outcome: 'o3' },
  { id: 'p10', name: "Admins can't restrict access by team", outcome: 'o4' },
  { id: 'p11', name: 'Usage-based bill is unpredictable', outcome: 'o4' },
  { id: 'p12', name: 'SSO setup requires contacting support', outcome: 'o4' },
];
const oppById = Object.fromEntries(OPPORTUNITIES.map(o => [o.id, o]));
const b = (opportunityId, p) => ({ opportunityId, name: oppById[opportunityId].name, p });

const TRIAGE_ITEMS = [
  { id: 't1', quote: 'We re-uploaded the weekly export and the row count came up about 900 short. Nobody told us which rows were dropped, so [email] diffed the file by hand.',
    source: { kind: 'zendesk', ref: '#48213', account: 'Juniper Freight', arr: 184000, date: 'Sep 19' },
    branches: [b('p1', 0.58), b('p2', 0.19)], pNone: 0.23, confidence: 0.58 },
  { id: 't2', quote: 'The exec dashboard was showing Tuesday\'s numbers on Thursday and nobody could tell. Then the totals looked wrong too.',
    source: { kind: 'nps', ref: '· score 4', account: 'Quillstack', arr: 54000, date: 'Sep 18' },
    branches: [b('p5', 0.44), b('p4', 0.38)], pNone: 0.18, confidence: 0.41 },
  { id: 't3', quote: 'Honestly the seat thing is what is hurting us. Our VP opens it once a month and we pay full price for that.',
    source: { kind: 'gong', ref: '00:14:32', account: 'Cobalt Insurance', arr: 310000, date: 'Sep 17' },
    branches: [b('p8', 0.55), b('p11', 0.30)], pNone: 0.15, confidence: 0.63 },
  { id: 't4', quote: 'Can someone call me at [phone]? The invoice jumped again and finance wants an explanation before Friday.',
    source: { kind: 'zendesk', ref: '#48377', account: 'Meridian Ops', arr: 118000, date: 'Sep 17' },
    branches: [b('p11', 0.49), b('p8', 0.12)], pNone: 0.39, confidence: 0.52 },
  { id: 't5', quote: 'Charts look fine in the app, but when I paste them into the board deck the legend is gone and the axis labels shrink.',
    source: { kind: 'nps', ref: '· score 6', account: 'Brightline Health', arr: 43000, date: 'Sep 16' },
    branches: [b('p7', 0.61), b('p9', 0.14)], pNone: 0.25, confidence: 0.66 },
  { id: 't6', quote: 'Security found that every regional manager can see every region. We can\'t roll out to EMEA until that is fixed.',
    source: { kind: 'gong', ref: '00:31:05', account: 'Halcyon Bank', arr: 240000, date: 'Sep 15' },
    branches: [b('p10', 0.52), b('p12', 0.29)], pNone: 0.19, confidence: 0.57 },
  { id: 't7', quote: 'The revenue page and the summary page disagree by a few hundred dollars for the same day. Which one is right?',
    source: { kind: 'zendesk', ref: '#48102', account: 'Lumen Clinics', arr: 74000, date: 'Sep 12' },
    branches: [b('p4', 0.38), b('p6', 0.34)], pNone: 0.28, confidence: 0.34 },
  { id: 't8', quote: 'Love the product overall. Would be nice if it were a bit faster. Send the survey results to [email] please.',
    source: { kind: 'nps', ref: '· score 8', account: 'Parcelly', arr: 62000, date: 'Sep 11' },
    branches: [b('p9', 0.18), b('p7', 0.12)], pNone: 0.70, confidence: 0.22 },
];

const SOURCE_LABEL = { zendesk: 'Zendesk ticket', nps: 'NPS comment', gong: 'Gong call' };
const THRESHOLD = 0.7;

const initialState = () => ({ queue: [...TRIAGE_ITEMS], log: [], selId: TRIAGE_ITEMS[0].id });

function decide(state, action) {
  switch (action.type) {
    case 'accept': case 'move': case 'discard': {
      const index = state.queue.findIndex(x => x.id === action.itemId);
      if (index < 0) return state;
      const item = state.queue[index];
      const targetId = action.type === 'accept' ? item.branches[0].opportunityId : action.type === 'move' ? action.targetId : null;
      const queue = state.queue.filter(x => x !== item);
      return { queue, log: [...state.log, { type: action.type, item, index, targetId }], selId: queue[Math.min(index, queue.length - 1)]?.id ?? null };
    }
    case 'undo': {
      const last = state.log.at(-1);
      if (!last) return state;
      const queue = [...state.queue];
      queue.splice(Math.min(last.index, queue.length), 0, last.item);
      return { queue, log: state.log.slice(0, -1), selId: last.item.id };
    }
    case 'select': return { ...state, selId: action.itemId };
    case 'clear': return { ...state, queue: [], selId: null };
    case 'reset': return initialState();
  }
  return state;
}

let state = initialState();
const ui = { picker: null, inboxFilter: '', inboxIdx: 0 };

const fmtArr = v => v >= 1e6 ? `$${(v / 1e6).toFixed(2)}M` : `$${Math.round(v / 1000)}k`;
const pct = p => `${Math.round(p * 100)}%`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const quoteHTML = q => esc(q).replace(/\[(email|phone|card)\]/g, '<span class="redact" title="Redacted before judging">[$1]</span>');
const confPill = c => `<span class="pill warn" title="Below the ${THRESHOLD} place threshold">⚠ ${pct(c)} confident</span>`;
const sourceMeta = s => `<div class="quote-meta"><b>${s.account}</b><span>${fmtArr(s.arr)} ARR</span><span>${SOURCE_LABEL[s.kind]} ${s.ref} · ${s.date}</span></div>`;
const selected = () => state.queue.find(x => x.id === state.selId) ?? null;
const selIndex = () => state.queue.findIndex(x => x.id === state.selId);

function beamRows(item, extra) {
  const [b1, b2] = item.branches;
  const row = (cls, rk, name, sub, p, bar, tail = '', attrs = '') => `<div class="br ${cls}" ${attrs}><span class="rk">${rk}</span><span class="nm">${name}${sub ? `<small>${sub}</small>` : ''}</span><div class="bar ${bar}"><i style="width:${pct(p)}"></i></div><span class="pct">${pct(p)}</span>${tail}</div>`;
  return [
    row('', '1', esc(b1.name), OUTCOMES[oppById[b1.opportunityId].outcome], b1.p, '', extra?.[0], extra ? 'data-act="accept" role="button"' : ''),
    row('', '2', esc(b2.name), OUTCOMES[oppById[b2.opportunityId].outcome], b2.p, 'b2', extra?.[1], extra ? `data-act="move-to" data-target="${b2.opportunityId}" role="button"` : ''),
    row('none', '–', 'None of these', '', item.pNone, 'none', extra?.[2], extra ? 'data-act="discard" role="button"' : ''),
  ].join('');
}

function actionButtons(item, { compact } = {}) {
  const name = esc(item.branches[0].name);
  return `<button class="btn primary" data-act="accept" title="Accept: place in ${name}"><span class="lbl">${compact ? 'Accept' : `Accept · ${name}`}</span><kbd>a</kbd></button>
    <button class="btn" data-act="move"><span class="lbl">Move…</span><kbd>m</kbd></button>
    <button class="btn danger" data-act="discard"><span class="lbl">Discard</span><kbd>d</kbd></button>`;
}

function emptyHTML() {
  const n = t => state.log.filter(l => l.type === t).length;
  const verb = { accept: 'Accepted', move: 'Moved', discard: 'Discarded' };
  const recent = state.log.slice(-5).reverse();
  return `<div class="empty">
    <div class="tick">✓</div>
    <h2>Queue clear</h2>
    <p>${state.log.length ? `${state.log.length} decision${state.log.length === 1 ? '' : 's'} logged as labels this session.` : 'No low-confidence placements are waiting.'} Labels tune the place threshold and question wording for pack place v3.</p>
    <p class="muted">The next run sends new placements under ${pct(THRESHOLD)} confidence here.</p>
    <div class="tally"><div><div class="k">Accepted</div><div class="v num">${n('accept')}</div></div><div><div class="k">Moved</div><div class="v num">${n('move')}</div></div><div><div class="k">Discarded</div><div class="v num">${n('discard')}</div></div></div>
    ${recent.length ? `<div class="labels">${recent.map(l => `<div class="lab"><span class="pill ${l.type === 'discard' ? 'flat' : 'linked'}">${verb[l.type]}</span><span>${l.targetId ? esc(oppById[l.targetId].name) : 'Not a problem statement'} · ${l.item.source.account}</span></div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn primary">Back to opportunities</button><button class="link" data-act="reset">Reset queue</button></div>
  </div>`;
}

function renderFocus() {
  const item = selected(), i = selIndex(), total = state.queue.length + state.log.length;
  if (!item) return emptyHTML();
  const done = state.log.length;
  const upNext = state.queue.slice(i + 1, i + 3);
  return `<div class="focus">
    <div class="prog"><span><b class="num">${i + 1}</b> of <span class="num">${state.queue.length}</span> left</span><div class="bar"><i style="width:${total ? done / total * 100 : 0}%"></i></div><span class="muted num">${done} decided</span></div>
    <article class="fcard" data-item="${item.id}">
      <div class="head">${confPill(item.confidence)}<span class="muted">below the ${pct(THRESHOLD)} place threshold</span></div>
      <blockquote>“${quoteHTML(item.quote)}”</blockquote>
      ${sourceMeta(item.source)}
      <div class="section-h"><span>Where the judge would place it</span><span>probability</span></div>
      <div class="beam">${beamRows(item)}</div>
      <div class="factions">${actionButtons(item)}</div>
    </article>
    <div class="section-h"><span>Up next</span><span><kbd>j</kbd> <kbd>k</kbd> to skip</span></div>
    <div class="next">${upNext.map(x => `<div class="ni"><span class="pill warn">${pct(x.confidence)}</span><span>${esc(x.quote)}</span></div>`).join('') || '<div class="ni muted">Last item in the queue.</div>'}</div>
  </div>`;
}

function renderList() {
  if (!state.queue.length) return emptyHTML();
  const mini = (br, cls) => `<div class="m"><span title="${esc(br.name)}">${esc(br.name)}</span><span class="pct">${pct(br.p)}</span><div class="bar ${cls}"><i style="width:${pct(br.p)}"></i></div></div>`;
  return `<div class="list">
    <div class="colhead"><span>Conf.</span><span>Quote</span><span>Top two branches</span><span style="text-align:right">Decide</span></div>
    ${state.queue.map(item => `<div class="lrow ${item.id === state.selId ? 'sel' : ''}" data-item="${item.id}">
      <div>${confPill(item.confidence).replace(' confident', '')}</div>
      <div class="q"><p>“${quoteHTML(item.quote)}”</p>${sourceMeta(item.source)}</div>
      <div class="mini">${mini(item.branches[0], '')}${mini(item.branches[1], 'b2')}<div class="muted" style="font-size:11.5px">None of these · ${pct(item.pNone)}</div></div>
      <div class="lacts">${actionButtons(item, { compact: true }).replaceAll('class="btn', 'class="btn sm')}</div>
    </div>`).join('')}
  </div>`;
}

function moveCandidates(item, filter) {
  const f = filter.trim().toLowerCase();
  const suggested = item.branches[1].opportunityId;
  const pool = OPPORTUNITIES.filter(o => o.id !== item.branches[0].opportunityId)
    .filter(o => !f || o.name.toLowerCase().includes(f) || OUTCOMES[o.outcome].toLowerCase().includes(f));
  return [...pool.filter(o => o.id === suggested), ...pool.filter(o => o.id !== suggested)];
}

function pickerListHTML(item, filter, idx) {
  const c = moveCandidates(item, filter);
  if (!c.length) return '<div class="pempty">No opportunity matches.</div>';
  let out = '', group = null;
  c.forEach((o, i) => {
    const g = o.id === item.branches[1].opportunityId ? 'Suggested · branch 2' : OUTCOMES[o.outcome];
    if (g !== group) { out += `<div class="pgroup">${g}</div>`; group = g; }
    out += `<button class="popt ${i === idx ? 'hi' : ''}" data-pick="${o.id}"><span class="nm">${esc(o.name)}</span>${o.id === item.branches[1].opportunityId ? `<span class="pct">${pct(item.branches[1].p)}</span>` : ''}</button>`;
  });
  return out;
}

function renderInbox() {
  if (!state.queue.length) return `<div style="grid-column:1/-1">${emptyHTML()}</div>`;
  const item = selected();
  const go = (label, key) => `<span class="go btn sm">${label}<kbd>${key}</kbd></span>`;
  return `<div class="ilist">
      <div class="ilist-h">Queue · ${state.queue.length}</div>
      ${state.queue.map(x => `<button class="ii ${x.id === state.selId ? 'sel' : ''}" data-select="${x.id}">
        <div class="t"><span>${esc(x.branches[0].name)}</span><span class="pill warn">${pct(x.confidence)}</span></div>
        <p>${quoteHTML(x.quote)}</p>
        <div class="quote-meta"><b>${x.source.account}</b><span>${SOURCE_LABEL[x.source.kind]} · ${x.source.date}</span></div>
      </button>`).join('')}
    </div>
    <div class="idetail" data-item="${item.id}">
      <div class="head">${confPill(item.confidence)}<span class="muted num">${selIndex() + 1} of ${state.queue.length}</span></div>
      <blockquote>“${quoteHTML(item.quote)}”</blockquote>
      ${sourceMeta(item.source)}
      <div class="section-h" style="max-width:680px"><span>Pick where it belongs</span><span>probability</span></div>
      <div class="ibeam">${beamRows(item, [go('Accept', 'a'), go('Move here', 'm ↵'), go('Discard', 'd')])}</div>
      <div class="section-h" style="max-width:680px"><span>Or move to another opportunity</span><span><kbd>m</kbd> to search</span></div>
      <div class="ipick"><input id="ipick-input" placeholder="Filter opportunities…" value="${esc(ui.inboxFilter)}" autocomplete="off" aria-label="Filter opportunities"><div class="plist" id="ipick-list">${pickerListHTML(item, ui.inboxFilter, ui.inboxIdx)}</div></div>
    </div>`;
}

const VARIANTS = [
  ['focus', 'A · Focus', 'Focus', 'One quote at a time with big actions and progress. Fastest for a keyboard run.', renderFocus],
  ['list', 'B · List', 'List', 'Prototype-D rank rows: the whole queue at once, inline actions on the selected row.', renderList],
  ['inbox', 'C · Inbox', 'Inbox', 'Queue on the left, detail on the right with the beam as choices and an inline move picker.', renderInbox],
];
let current = location.hash.slice(1);
if (!VARIANTS.some(v => v[0] === current)) current = 'focus';

function render() {
  const n = state.queue.length;
  const badge = document.getElementById('badge');
  badge.textContent = n; badge.classList.toggle('zero', !n);
  document.getElementById('tb').innerHTML = `<h1>Triage</h1><span class="muted">${n ? `${n} low-confidence placement${n === 1 ? '' : 's'} under ${pct(THRESHOLD)}` : 'Nothing waiting'}</span><div class="spacer"></div>
    <div class="keys"><span><kbd>a</kbd> accept</span><span><kbd>m</kbd> move</span><span><kbd>d</kbd> discard</span><span><kbd>j</kbd><kbd>k</kbd> select</span><span><kbd>u</kbd> undo</span></div>`;
  for (const [k, , , , fn] of VARIANTS) {
    const el = document.getElementById('v-' + k);
    el.classList.toggle('on', k === current);
    if (k === current) el.innerHTML = fn();
  }
  document.getElementById('switcher').innerHTML = VARIANTS.map(([k, l, s, d], i) => `<button class="${k === current ? 'on' : ''}" data-v="${k}" title="${d}"><kbd>${i + 1}</kbd><span class="long">${l}</span><span class="short">${s}</span></button>`).join('')
    + `<span class="sep"></span><button data-act="${n ? 'clear' : 'reset'}" title="${n ? 'Jump to the empty state' : 'Restore the mock queue'}"><kbd>e</kbd>${n ? 'Clear' : 'Reset'}</button>`;
  if (ui.picker) renderPicker();
}

function dispatch(action, toast) {
  state = decide(state, action);
  ui.inboxFilter = ''; ui.inboxIdx = 0;
  render();
  if (toast) showToast(toast);
  scrollSelectedIntoView();
}

function scrollSelectedIntoView() {
  // The stacked mobile Inbox puts the detail above the list, so the detail holds the next decision.
  const sel = current === 'inbox' && matchMedia('(max-width: 760px)').matches ? '#v-inbox .idetail' : `#v-${current} .lrow.sel, #v-${current} .ii.sel`;
  document.querySelector(sel)?.scrollIntoView({ block: 'nearest' });
}

let toastTimer;
function showToast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
const short = s => s.length > 34 ? s.slice(0, 33) + '…' : s;

function act(kind, targetId) {
  const item = selected();
  if (!item) return;
  if (kind === 'accept') dispatch({ type: 'accept', itemId: item.id }, `Placed in ${esc(short(item.branches[0].name))}<kbd>u</kbd> undo`);
  if (kind === 'discard') dispatch({ type: 'discard', itemId: item.id }, `Discarded · logged as “not a problem”<kbd>u</kbd> undo`);
  if (kind === 'move-to') { closePicker(); dispatch({ type: 'move', itemId: item.id, targetId }, `Moved to ${esc(short(oppById[targetId].name))}<kbd>u</kbd> undo`); }
  if (kind === 'move') {
    if (current === 'inbox') document.getElementById('ipick-input')?.focus();
    else openPicker();
  }
}

function openPicker() {
  ui.picker = { filter: '', idx: 0 };
  document.getElementById('scrim').classList.add('on');
  renderPicker();
  const input = document.getElementById('picker-input');
  input.value = '';
  input.focus();
}
function closePicker() {
  ui.picker = null;
  document.getElementById('picker-input')?.blur();
  document.getElementById('scrim').classList.remove('on');
}
function renderPicker() {
  const item = selected();
  if (!item) return closePicker();
  const el = document.getElementById('picker');
  if (!el.firstChild) {
    el.innerHTML = `<div class="picker-h" id="picker-h"></div><input id="picker-input" placeholder="Move to opportunity…" autocomplete="off" aria-label="Filter opportunities"><div class="plist" id="picker-list"></div><div class="picker-f"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>↵</kbd> move</span><span><kbd>esc</kbd> close</span></div>`;
  }
  document.getElementById('picker-h').innerHTML = `Move <b>${item.source.account}</b>'s quote to another opportunity`;
  document.getElementById('picker-list').innerHTML = pickerListHTML(item, ui.picker.filter, ui.picker.idx);
  document.querySelector('#picker-list .popt.hi')?.scrollIntoView({ block: 'nearest' });
}

function pickerKeys(e, get, set, rerender) {
  const item = selected();
  const c = moveCandidates(item, get().filter);
  if (e.key === 'ArrowDown') { e.preventDefault(); set({ idx: Math.min(c.length - 1, get().idx + 1) }); rerender(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); set({ idx: Math.max(0, get().idx - 1) }); rerender(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (c[get().idx]) act('move-to', c[get().idx].id); }
  else if (e.key === 'Escape') { e.preventDefault(); return 'esc'; }
}

document.addEventListener('input', e => {
  if (e.target.id === 'picker-input') { ui.picker = { filter: e.target.value, idx: 0 }; renderPicker(); }
  if (e.target.id === 'ipick-input') {
    ui.inboxFilter = e.target.value; ui.inboxIdx = 0;
    document.getElementById('ipick-list').innerHTML = pickerListHTML(selected(), ui.inboxFilter, 0);
  }
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'picker-input') {
    if (pickerKeys(e, () => ui.picker, p => Object.assign(ui.picker, p), renderPicker) === 'esc') closePicker();
    return;
  }
  if (e.target.id === 'ipick-input') {
    const r = pickerKeys(e, () => ({ filter: ui.inboxFilter, idx: ui.inboxIdx }), p => { ui.inboxIdx = p.idx; }, () => {
      document.getElementById('ipick-list').innerHTML = pickerListHTML(selected(), ui.inboxFilter, ui.inboxIdx);
      document.querySelector('#ipick-list .popt.hi')?.scrollIntoView({ block: 'nearest' });
    });
    if (r === 'esc') e.target.blur();
    return;
  }
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = VARIANTS[+e.key - 1];
  if (v) { show(v[0]); return; }
  const i = selIndex();
  const step = d => { const q = state.queue; if (q.length) { state = decide(state, { type: 'select', itemId: q[Math.max(0, Math.min(q.length - 1, i + d))].id }); ui.inboxFilter = ''; ui.inboxIdx = 0; render(); scrollSelectedIntoView(); } };
  switch (e.key) {
    case 'a': act('accept'); break;
    case 'm': e.preventDefault(); act('move'); break;
    case 'd': act('discard'); break;
    case 'u': case 'z': if (state.log.length) dispatch({ type: 'undo' }, 'Undid the last decision'); break;
    case 'e': case '0': dispatch({ type: state.queue.length ? 'clear' : 'reset' }); break;
    case 'j': case 'ArrowDown': case 'ArrowRight': e.preventDefault(); step(1); break;
    case 'k': case 'ArrowUp': case 'ArrowLeft': e.preventDefault(); step(-1); break;
  }
});

document.addEventListener('click', e => {
  const sw = e.target.closest('[data-v]');
  if (sw) return show(sw.dataset.v);
  const pick = e.target.closest('[data-pick]');
  if (pick) return act('move-to', pick.dataset.pick);
  if (e.target.id === 'scrim') return closePicker();
  const a = e.target.closest('[data-act]');
  const row = e.target.closest('[data-item], [data-select]');
  const id = row?.dataset.item ?? row?.dataset.select;
  if (id && id !== state.selId) { state = decide(state, { type: 'select', itemId: id }); ui.inboxFilter = ''; ui.inboxIdx = 0; }
  if (a) {
    const k = a.dataset.act;
    if (k === 'clear' || k === 'reset') return dispatch({ type: k });
    return act(k, a.dataset.target);
  }
  if (id) render();
});

function show(v) {
  current = v; history.replaceState(null, '', '#' + v);
  closePicker(); render();
  document.querySelector('main').scrollTop = 0;
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VARIANTS.some(v => v[0] === h)) show(h); });
render();
</script>
</body>
</html>
